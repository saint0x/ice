<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Ice — desktop IDE app icon ("Monolith")
    Concept: faceted crystal monolith on deep ink tile.
    The central vertical ridge naturally reads as an "I".
    Light source: upper-right. Material: cold engineered glass.
  -->
  <defs>
    <!-- Tile background -->
    <linearGradient id="tileBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142034"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#03070F"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.28" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#3E6A9C" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#1B3355" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tileVignette" cx="0.5" cy="0.9" r="0.95">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Crystal facets. Light from upper-right. -->
    <linearGradient id="fTopLeft" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7EA9CC"/>
      <stop offset="0.55" stop-color="#3E6283"/>
      <stop offset="1" stop-color="#1E3550"/>
    </linearGradient>
    <linearGradient id="fTopRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF5FD"/>
      <stop offset="0.4" stop-color="#BBDCF3"/>
      <stop offset="1" stop-color="#6094C2"/>
    </linearGradient>
    <linearGradient id="fLeft" x1="0" y1="0.1" x2="1" y2="0.9">
      <stop offset="0" stop-color="#2C4666"/>
      <stop offset="0.6" stop-color="#172A42"/>
      <stop offset="1" stop-color="#0A1828"/>
    </linearGradient>
    <linearGradient id="fRight" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#84B0D4"/>
      <stop offset="0.5" stop-color="#4A78A0"/>
      <stop offset="1" stop-color="#22405E"/>
    </linearGradient>
    <linearGradient id="fBotLeft" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#142338"/>
      <stop offset="1" stop-color="#05101E"/>
    </linearGradient>
    <linearGradient id="fBotRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#355878"/>
      <stop offset="1" stop-color="#0C1A2C"/>
    </linearGradient>

    <linearGradient id="spineHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#E6F4FF" stop-opacity="0.55"/>
      <stop offset="0.88" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="apexGlint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#D6EEFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D6EEFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6FAEE0" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#2A5882" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="crystalShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="tileBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.06" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="tileClip">
      <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="url(#tileBase)"/>
    <rect width="1024" height="1024" fill="url(#tileGlow)"/>
    <rect width="1024" height="1024" fill="url(#tileVignette)"/>

    <!-- Engineered grid (barely visible) -->
    <g opacity="0.05" stroke="#7EB6E8" stroke-width="1">
      <line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="768" x2="1024" y2="768"/>
      <line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="768" y1="0" x2="768" y2="1024"/>
    </g>

    <rect width="1024" height="1024" fill="url(#auraGlow)"/>

    <g filter="url(#crystalShadow)">
      <!-- Hex prism facets:
           apex top (512,152) · shoulders (330,318)(694,318)
           waist (330,722)(694,722) · apex bottom (512,880) -->
      <path d="M 512 152 L 330 318 L 512 318 Z" fill="url(#fTopLeft)"/>
      <path d="M 512 152 L 694 318 L 512 318 Z" fill="url(#fTopRight)"/>
      <path d="M 330 318 L 512 318 L 512 722 L 330 722 Z" fill="url(#fLeft)"/>
      <path d="M 512 318 L 694 318 L 694 722 L 512 722 Z" fill="url(#fRight)"/>
      <path d="M 330 722 L 512 722 L 512 880 Z" fill="url(#fBotLeft)"/>
      <path d="M 512 722 L 694 722 L 512 880 Z" fill="url(#fBotRight)"/>

      <!-- Internal channel (technical detail) -->
      <g opacity="0.65">
        <path d="M 478 340 L 512 340 L 512 700 L 478 700 Z" fill="#0A1828" opacity="0.35"/>
        <path d="M 512 340 L 546 340 L 546 700 L 512 700 Z" fill="#8FB8DC" opacity="0.18"/>
      </g>

      <!-- Spine — reads as "I" -->
      <rect x="510" y="152" width="4" height="728" fill="url(#spineHi)"/>

      <!-- Lit-side edge highlights -->
      <path d="M 512 152 L 694 318" stroke="#F0F8FF" stroke-width="2.2" stroke-opacity="0.85" fill="none" stroke-linecap="round"/>
      <path d="M 694 318 L 694 722" stroke="#CFE5F7" stroke-width="2" stroke-opacity="0.55" fill="none" stroke-linecap="round"/>
      <path d="M 694 722 L 512 880" stroke="#7FB0D8" stroke-width="1.5" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>

      <!-- Shadow-side rim light -->
      <path d="M 512 152 L 330 318" stroke="#6E9BC4" stroke-width="1.2" stroke-opacity="0.35" fill="none" stroke-linecap="round"/>
      <path d="M 330 318 L 330 722" stroke="#3E6388" stroke-width="1" stroke-opacity="0.3" fill="none" stroke-linecap="round"/>

      <!-- Crease lines -->
      <line x1="330" y1="318" x2="694" y2="318" stroke="#8CBBE0" stroke-width="1" stroke-opacity="0.22"/>
      <line x1="330" y1="722" x2="694" y2="722" stroke="#1B2C42" stroke-width="1" stroke-opacity="0.5"/>

      <!-- Apex glint -->
      <circle cx="512" cy="158" r="28" fill="url(#apexGlint)"/>
      <circle cx="512" cy="154" r="3.2" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="512" cy="878" r="2.2" fill="#BDDCF4" opacity="0.7"/>
    </g>

    <rect width="1024" height="1024" fill="url(#tileBevel)"/>

    <!-- Hairline rim -->
    <rect x="1.5" y="1.5" width="1021" height="1021" rx="230.5" ry="230.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>
  </g>
</svg>
